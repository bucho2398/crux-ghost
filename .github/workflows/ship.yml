name: Check, build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional new release tag (for example v0.2.0)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
  android:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/crux-ghost.jks"
      - name: Build signed APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/crux-ghost.jks
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: crux-ghost-android
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/crux-ghost.jks"
  pages:
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [android, pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crux-ghost-android
          path: apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv apk/app-release.apk apk/crux-ghost.apk
          gh release create "$RELEASE_TAG" apk/crux-ghost.apk --target "$GITHUB_SHA" --title "Crux Ghost $RELEASE_TAG" --notes "Local climbing video comparison. Signed Android APK; iPhone and iPad use the installable GitHub Pages app."
